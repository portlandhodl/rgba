[package]
name = "rgba"
description = "rgba emulator frontend (egui + cpal audio)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rgba"
path = "src/main.rs"

[dependencies]
rgba-core = { path = "../rgba-core" }
rgba-debugger = { path = "../rgba-debugger" }
rgba-gb = { path = "../rgba-gb" }
rgba-gba = { path = "../rgba-gba" }
cpal = "0.15"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
eframe = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
png = "0.18"
gilrs = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
