name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - run: cargo test --workspace

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Build .deb package
        run: packaging/build-deb.sh
      - name: Build standalone binary tarball
        run: |
          strip -o rgba target/release/rgba
          tar -czf rgba-linux-x86_64.tar.gz rgba
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/deb/*.deb
            rgba-linux-x86_64.tar.gz
          generate_release_notes: true
