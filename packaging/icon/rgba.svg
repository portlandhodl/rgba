<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128">
  <!-- rgba app icon: an open, glacier-ice Game Boy Advance SP, tilted. -->
  <defs>
    <!-- AGS clamshell, opened flat: screen lid, hinge barrel, control base -->
    <rect id="lid" x="4" y="4" width="84" height="70" rx="9"/>
    <rect id="hinge" x="3" y="71" width="86" height="13" rx="6.5"/>
    <rect id="base" x="4" y="82" width="84" height="74" rx="9"/>
    <g id="outline"><use xlink:href="#lid"/><use xlink:href="#hinge"/><use xlink:href="#base"/></g>

    <!-- translucent ice-blue plastic -->
    <linearGradient id="ice" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e8f8fe"/>
      <stop offset="0.5" stop-color="#ade0f2"/>
      <stop offset="1" stop-color="#78bfdf"/>
    </linearGradient>
    <linearGradient id="iceBase" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#cdeefa"/>
      <stop offset="0.5" stop-color="#9fd7ee"/>
      <stop offset="1" stop-color="#68b2d6"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ea"/>
      <stop offset="0.35" stop-color="#e6f7fd"/>
      <stop offset="1" stop-color="#4f9cc6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8fbc"/>
      <stop offset="0.5" stop-color="#5aa6cd"/>
      <stop offset="1" stop-color="#357fab"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#1c2027"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb0d6"/>
      <stop offset="1" stop-color="#2e5f8a"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6676"/>
      <stop offset="1" stop-color="#2f3540"/>
    </linearGradient>
    <linearGradient id="abkey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c3d6"/>
      <stop offset="1" stop-color="#7d89a3"/>
    </linearGradient>
    <clipPath id="lidClip"><use xlink:href="#lid"/></clipPath>
    <clipPath id="baseClip"><use xlink:href="#base"/></clipPath>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="72" cy="114" rx="34" ry="5" fill="#0b3550" opacity="0.35" filter="url(#soft)"/>

  <!-- case thickness: stacked copies of the tilted outline, shifted down -->
  <g fill="url(#wall)">
    <use xlink:href="#outline" transform="translate(1.5,6) translate(63,59) rotate(-14) scale(0.63) translate(-46,-80)"/>
    <use xlink:href="#outline" transform="translate(1,4) translate(63,59) rotate(-14) scale(0.63) translate(-46,-80)"/>
    <use xlink:href="#outline" transform="translate(0.5,2) translate(63,59) rotate(-14) scale(0.63) translate(-46,-80)"/>
  </g>

  <g transform="translate(63,59) rotate(-14) scale(0.63) translate(-46,-80)">
    <!-- ===== lid ===== -->
    <use xlink:href="#lid" fill="url(#ice)" stroke="#3d86b3" stroke-width="1.4"/>
    <g clip-path="url(#lidClip)">
      <path d="M4,4 H50 C30,10 14,26 4,52 Z" fill="#ffffff" opacity="0.45"/>
      <use xlink:href="#lid" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" transform="translate(0,1.5)"/>
    </g>
    <!-- screen lens + 3:2 LCD -->
    <rect x="10" y="10" width="72" height="56" rx="5" fill="url(#lens)"/>
    <path d="M15,10.8 H77 C80,10.8 81,12 81.2,15 H10.8 C11,12 12,10.8 15,10.8 Z" fill="#ffffff" opacity="0.12"/>
    <rect x="19" y="15" width="54" height="36" fill="url(#lcd)"/>
    <polygon points="19,15 37,15 27,51 19,51" fill="#ffffff" opacity="0.13"/>
    <rect x="30" y="57" width="32" height="3" rx="1.5" fill="#8b93a3" opacity="0.6"/>

    <!-- ===== base ===== -->
    <use xlink:href="#base" fill="url(#iceBase)" stroke="#3d86b3" stroke-width="1.4"/>
    <g clip-path="url(#baseClip)">
      <path d="M4,84 H40 C24,92 12,104 4,124 Z" fill="#ffffff" opacity="0.35"/>
      <!-- faint internals through the clear plastic -->
      <g fill="none" stroke="#2f7fae" opacity="0.22" stroke-width="1.2">
        <rect x="12" y="92" width="68" height="56" rx="5"/>
        <circle cx="24" cy="108" r="13"/>
        <path d="M58,130 H80 M14,128 H34 V146"/>
      </g>
    </g>

    <!-- D-pad -->
    <circle cx="24" cy="108" r="13" fill="#7fbcd9" opacity="0.5"/>
    <g fill="url(#key)">
      <rect x="13" y="104" width="22" height="8" rx="1.6"/>
      <rect x="20" y="97" width="8" height="22" rx="1.6"/>
    </g>
    <circle cx="24" cy="108" r="2.2" fill="#262b34"/>

    <!-- A / B -->
    <circle cx="75" cy="100" r="7" fill="url(#abkey)" stroke="#5a6680" stroke-width="0.8"/>
    <circle cx="62" cy="111" r="7" fill="url(#abkey)" stroke="#5a6680" stroke-width="0.8"/>
    <circle cx="73" cy="97.5" r="2.4" fill="#ffffff" opacity="0.45"/>
    <circle cx="60" cy="108.5" r="2.4" fill="#ffffff" opacity="0.45"/>

    <!-- light button between the D-pad and A/B -->
    <circle cx="46" cy="93" r="2.4" fill="url(#key)"/>

    <!-- SELECT / START, small round buttons lower right -->
    <circle cx="60" cy="138" r="3" fill="url(#key)"/>
    <circle cx="72" cy="138" r="3" fill="url(#key)"/>

    <!-- power + charge LEDs -->
    <circle cx="44" cy="132" r="1.7" fill="#4dff7a"/>
    <circle cx="44" cy="132" r="3.2" fill="#4dff7a" opacity="0.2"/>
    <circle cx="44" cy="139" r="1.5" fill="#3c6f8f" opacity="0.7"/>

    <!-- speaker, lower left -->
    <g fill="#2e6f98" opacity="0.7">
      <circle cx="16" cy="134" r="1.3"/><circle cx="21" cy="134" r="1.3"/><circle cx="26" cy="134" r="1.3"/>
      <circle cx="18.5" cy="139" r="1.3"/><circle cx="23.5" cy="139" r="1.3"/>
      <circle cx="16" cy="144" r="1.3"/><circle cx="21" cy="144" r="1.3"/><circle cx="26" cy="144" r="1.3"/>
    </g>

    <!-- ===== hinge barrel (drawn last; it sits between the halves) ===== -->
    <use xlink:href="#hinge" fill="url(#barrel)" stroke="#3d86b3" stroke-width="1.2"/>
    <path d="M24,72.5 V82.5 M68,72.5 V82.5" stroke="#3d86b3" stroke-width="1" opacity="0.7"/>
  </g>
</svg>
